name: Visual Lock Refresh

on:
  push:
    branches:
      - agent/visual-creative-engine
    paths:
      - requirements.in
      - requirements-dev.in
      - .github/workflows/visual-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh-locks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pip-tools
        run: python -m pip install --disable-pip-version-check pip-tools==7.5.2
      - name: Regenerate production lock
        run: python -m piptools compile --generate-hashes --strip-extras --output-file=requirements.txt requirements.in
      - name: Regenerate development lock
        run: python -m piptools compile --generate-hashes --strip-extras --output-file=requirements-dev.txt requirements-dev.in
      - name: Upload regenerated locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-lock-refresh
          path: |
            requirements.txt
            requirements-dev.txt
          if-no-files-found: error
