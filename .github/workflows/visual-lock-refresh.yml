name: Visual Lock Refresh

on:
  push:
    branches:
      - agent/visual-creative-engine
    paths:
      - requirements.in
      - .github/workflows/visual-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/visual-creative-engine

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic compiler for Python 3.12
        run: python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3

      - name: Compile Python 3.12 hash locks
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-dev.txt \
            requirements-dev.in

      - name: Prove Python 3.12 runtime lock installation
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deterministic compiler for Python 3.13
        run: python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3

      - name: Compile Python 3.13 runtime hash lock
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-py313.txt \
            requirements.in

      - name: Prove Python 3.13 runtime lock installation
        run: python -m pip install --require-hashes -r requirements-py313.txt

      - name: Commit deterministic locks
        run: |
          changes="$(git status --porcelain -- requirements.txt requirements-dev.txt requirements-py313.txt)"
          if [ -z "$changes" ]; then
            echo 'DEPENDENCY_LOCK_CURRENT'
            exit 0
          fi
          printf '%s\n' "$changes"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt requirements-dev.txt requirements-py313.txt
          git commit -m 'Refresh deterministic dependency locks'
          git push origin HEAD:agent/visual-creative-engine
